# yaml-language-server: $schema=https://kortix.com/schema/kortix.schema.json
#
# An example company (acme-co) run as an AI operating system.
#
# The governance rule this manifest is built on:
# The project REGISTERS what exists (skills, tools, commands, extensions,
# connectors, secrets). Each AGENT decides its prompt, model and permission,
# and which registered things it enables, by name. Skills, commands,
# extensions, connectors and secrets are default-deny: an agent reaches only
# what it names. Tools and subagents are the exception — an agent gets every
# tool and may start every agent unless the manifest narrows them.
#
# Adapted from the Kortix starter manifest, which is the authority for the
# schema:
# https://github.com/kortix-ai/suna/blob/dev/packages/starter/templates/base/kortix.yaml

default_agent: kortix

project:
  name: acme-co
  description: An example company run as an AI operating system.

env:
  required: []
  optional: [STRIPE_API_KEY]

agents:
  kortix:
    prompt_file: agents/kortix.md
    tools: all
    subagents: all
    workspace:
      project_repository: true
  ops-reporter:
    prompt_file: agents/ops-reporter.md
    tools: all
    subagents: all
    connectors: []
    workspace:
      project_repository: true
  support-triage:
    prompt_file: agents/support-triage.md
    tools: all
    subagents: all
    connectors: []
    workspace:
      project_repository: true
  code-fixer:
    prompt_file: agents/code-fixer.md
    tools: all
    subagents: all
    connectors: []
    workspace:
      project_repository: true

triggers:
  - slug: daily-ops-digest
    type: cron
    cron: '0 9 * * 1-5'
    prompt: Summarize yesterday's support tickets and open a change request with the digest.
